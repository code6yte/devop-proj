---
- name: Self-Healing Web Server Playbook
  hosts: localhost
  gather_facts: yes
  vars:
    compose_project: s
    web_service_name: web
    network_name: s_network
    desired_replicas: "{{ lookup('env', 'TARGET_REPLICAS') | default(3, true) | int }}"
    backup_image: "s-web-backup:latest"
    
  tasks:
    # 1. Check current running web containers
    - name: Get current running web containers count
      shell: |
        docker ps --filter "label=com.docker.compose.project={{ compose_project }}" \
                  --filter "label=com.docker.compose.service={{ web_service_name }}" \
                  --format "{{'{{'}}{{'}}'}} .ID {{'{{'}}{{'}}'}} .Names" | wc -l
      register: current_count
      changed_when: false

    - name: Display current state
      debug:
        msg: "Current: {{ current_count.stdout | int }} containers, Desired: {{ desired_replicas }} containers"

    # 2. Calculate how many containers need to be created
    - name: Calculate containers to create
      set_fact:
        containers_needed: "{{ (desired_replicas | int) - (current_count.stdout | int) }}"

    # 3. Start missing containers from backup image
    - name: Start new web containers from backup image
      shell: |
        docker run -d \
          --name s-web-restored-{{ ansible_date_time.epoch }}-{{ item }} \
          --network {{ network_name }} \
          --label com.docker.compose.project={{ compose_project }} \
          --label com.docker.compose.service={{ web_service_name }} \
          --label restored=true \
          --label restored.timestamp={{ ansible_date_time.iso8601 }} \
          {{ backup_image }}
      loop: "{{ range(1, (containers_needed | int) + 1) | list }}"
      when: containers_needed | int > 0
      register: container_restore
      ignore_errors: yes
      ignore_errors: yes

    - name: Notify Discord of Container Restoration
      uri:
        url: "{{ lookup('env', 'DISCORD_WEBHOOK_URL') }}"
        method: POST
        body_format: json
        body:
          embeds:
            - title: "🔧 Self-Healing: Containers Restored"
              description: "{{ containers_needed }} container(s) were restored from backup image."
              color: 3066993  # Green
              fields:
                - name: "Previous Count"
                  value: "{{ current_count.stdout }}"
                  inline: true
                - name: "Target Count"
                  value: "{{ desired_replicas }}"
                  inline: true
                - name: "Restored Count"
                  value: "{{ containers_needed }}"
                  inline: true
                - name: "Backup Image"
                  value: "`{{ backup_image }}`"
                  inline: false
      when: 
        - containers_needed | int > 0
        - lookup('env', 'DISCORD_WEBHOOK_URL') != ""
      ignore_errors: yes

    # 4. Remove excess containers if too many are running
    - name: Get excess container IDs
      shell: |
        docker ps --filter "label=com.docker.compose.project={{ compose_project }}" \
                  --filter "label=com.docker.compose.service={{ web_service_name }}" \
                  --format "{{'{{'}}{{'}}'}} .ID" | tail -n +{{ desired_replicas | int + 1 }}
      register: excess_containers
      when: current_count.stdout | int > desired_replicas | int
      changed_when: false

    - name: Stop and remove excess containers
      shell: "docker rm -f {{ item }}"
      loop: "{{ excess_containers.stdout_lines }}"
      when: 
        - current_count.stdout | int > desired_replicas | int
        - excess_containers.stdout_lines | length > 0
      ignore_errors: yes

    - name: Notify Discord of Excess Container Removal
      uri:
        url: "{{ lookup('env', 'DISCORD_WEBHOOK_URL') }}"
        method: POST
        body_format: json
        body:
          embeds:
            - title: "🗑️ Self-Healing: Excess Containers Removed"
              description: "Removed {{ excess_containers.stdout_lines | length }} excess container(s)."
              color: 15844367  # Gold
              fields:
                - name: "Previous Count"
                  value: "{{ current_count.stdout }}"
                  inline: true
                - name: "Target Count"
                  value: "{{ desired_replicas }}"
                  inline: true
      when: 
        - current_count.stdout | int > desired_replicas | int
        - excess_containers.stdout_lines | length > 0
        - lookup('env', 'DISCORD_WEBHOOK_URL') != ""
      ignore_errors: yes
      uri:
        url: "{{ lookup('env', 'DISCORD_WEBHOOK_URL') }}"
        method: POST
        body_format: json
        body:
          embeds:
            - title: "🛠️ Healing Action Taken"
              description: "Ansible enforced the cluster state."
              color: 3066993 # Green
              fields:
                - name: "Output"
                  value: "```\n{{ (compose_scale.stderr | default(compose_scale.stdout) | regex_findall('Container\s+([a-zA-Z0-9_-]+)\s+(Created|Recreating|Started)') | map('join', '   ') | join('\n') | trim) or 'State OK (No changes detected)' }}
```"
                  inline: false
      when: lookup('env', 'DISCORD_WEBHOOK_URL') != ""
      ignore_errors: yes

    # 2. Verify and Heal Content (in ALL web containers)
    - name: Get list of all web container IDs
      shell: |
        docker ps --filter "label=com.docker.compose.project=s" --filter "label=com.docker.compose.service={{ web_service_name }}" --format "{{ '{{' }}.ID{{ '}}' }}"
      register: web_containers
      changed_when: false

    - name: Wait for App to Start (Port 3000)
      shell: "docker exec {{ item }} sh -c 'for i in $(seq 1 30); do wget -q --spider http://127.0.0.1:3000 && exit 0; sleep 2; done; exit 1'"
      register: wait_app
      loop: "{{ web_containers.stdout_lines }}"
      ignore_errors: yes
      changed_when: false

    - name: Check Health in each container
      shell: "docker exec {{ item }} wget -q --spider http://127.0.0.1:3000"
      register: health_check
      ignore_errors: yes
      loop: "{{ web_containers.stdout_lines }}"
      changed_when: false

    - name: Notify Discord if Health Check Fails
      uri:
        url: "{{ lookup('env', 'DISCORD_WEBHOOK_URL') }}"
        method: POST
        body_format: json
        body:
          embeds:
            - title: "⚠️ Health Check Warning"
              description: "Container `{{ item.item }}` is not responding after startup wait."
              color: 16763904  # Orange
              fields:
                - name: "Status"
                  value: "Unreachable (Port 3000)"
                  inline: true
      when: item.rc != 0 and lookup('env', 'DISCORD_WEBHOOK_URL') != ""
      loop: "{{ health_check.results }}"
      ignore_errors: yes

    - name: Display status
      debug:
        msg: "Healing complete. {{ web_containers.stdout_lines | length }} web containers are running."