services:
  ansible:
    build:
      context: .
      dockerfile: docker/ansible/Dockerfile
    image: ansible-control:local
    container_name: ansible
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ansible/playbook.yml:/ansible/playbook-live.yml:ro  # Mount live playbook
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TARGET_REPLICAS=${REPLICAS:-3}
      - PLAYBOOK_FILE=/ansible/playbook-live.yml
    working_dir: /ansible
    networks:
      - network

  web:
    build: docker/web
    image: s-web:${IMAGE_TAG:-latest}
    ports:
      - "8090-8099:3000"
    networks:
      - network

networks:
  network:
    driver: bridge
